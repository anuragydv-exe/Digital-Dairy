services:
  - type: web
    name: digital-dairy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GOOGLE_SHEETS_WEB_APP_URL
        sync: false
      - key: GOOGLE_SHEETS_SHARED_SECRET
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
